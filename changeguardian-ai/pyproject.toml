[project]
name = "changeguardian-ai"
version = "0.1.0"
description = "Autonomous Change Impact Analysis Platform"
requires-python = ">=3.12"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
select = ["E", "F", "I"]
